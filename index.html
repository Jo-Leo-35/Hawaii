<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f65b0a">
  <meta name="description" content="Leo 與 Tyson 的歐胡島旅行指南。Day 1–8 行程、公開景點導航與行前分工。">
  <title>Hawaii Guide · Leo & Tyson</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#itinerary">跳到每日行程</a>
  <header class="header">
    <div class="header-inner wrap">
      <a class="brand" href="#top"><strong>O’AHU</strong><span>TRAVEL ATLAS</span></a>
      <nav aria-label="主要導覽"><a class="active" href="#itinerary">每日行程</a><a href="#places">景點收藏</a><a href="#resources">實用資訊</a></nav>
      <a class="primary header-action" href="#checklist"><img class="icon" src="./assets/icons/check-circle.svg" alt="">行前分工</a>
    </div>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <img src="./assets/hero-oahu.webp" alt="原旅行筆記的歐胡島山海主視覺，AI 情境圖" fetchpriority="high" width="1800" height="600">
      <div class="hero-copy wrap"><h1 id="hero-title">歐胡島，想玩的都排進去。</h1>
        <form id="hero-search" class="hero-search search" role="search"><img class="icon" src="./assets/icons/magnifying-glass.svg" alt=""><label class="sr-only" for="hero-query">搜尋景點、美食、活動</label><input id="hero-query" type="search" placeholder="搜尋景點、美食、活動"><button class="primary" type="submit">搜尋</button></form>
      </div>
    </section>
    <div class="categories wrap" id="categories" role="group" aria-label="依景點類別查看"></div>
    <p id="load-error" class="wrap error" role="alert" hidden>行程暫時無法載入，請重新整理或稍後再試。</p>
    <section id="itinerary" class="section wrap" aria-labelledby="itinerary-title">
      <div class="section-head"><div><h2 id="itinerary-title">每日行程</h2><p class="section-caption">選一天，看看當天去哪裡。</p></div><span class="section-caption">Day 1–8</span></div>
      <div id="day-tabs" class="day-tabs" role="tablist" aria-label="Day 1–8"></div>
      <div id="day-panel" class="day-panel" role="tabpanel" tabindex="0"></div>
    </section>
    <section id="places" class="section wrap" aria-labelledby="places-title">
      <div class="section-head"><div><h2 id="places-title">想去的地方</h2><p class="section-caption" id="place-count"></p></div><button id="show-all-places" class="text-button" type="button">查看全部收藏</button></div>
      <div class="place-toolbar"><label class="search"><img class="icon" src="./assets/icons/magnifying-glass.svg" alt=""><span class="sr-only">搜尋景點與區域</span><input id="place-search" type="search" placeholder="搜尋景點、餐廳或區域"></label><button id="clear-place-filters" class="text-button" type="button" hidden>清除篩選</button></div>
      <div id="place-list" class="place-grid"></div><p id="place-empty" class="empty" hidden>沒有符合的地點，試試其他關鍵字。</p>
    </section>
    <section id="checklist" class="section section-soft" aria-labelledby="checklist-title"><div class="wrap">
      <div class="section-head"><div><h2 id="checklist-title">行前分工</h2><p class="section-caption">Leo 與 Tyson，一起把準備做完。</p></div><span id="task-summary" class="section-caption"></span></div>
      <div id="task-filters" class="filters" role="group" aria-label="依負責人篩選"></div>
      <div id="task-list" class="task-grid"></div>
      <p class="fine-print">進度由 Leo 更新；活動加入行程不代表已完成預約，集合資訊以實際確認單為準。</p>
    </div></section>
    <section id="resources" class="section wrap resources" aria-labelledby="resources-title"><div class="section-head"><div><h2 id="resources-title">出發前，放在手邊</h2></div></div><div id="resource-list" class="resource-grid"></div></section>
  </main>
  <footer class="footer wrap"><div><strong>OʻAHU · LEO & TYSON</strong><p>留一點空白，給路上的好風景。</p></div><div><a href="./CREDITS.html">照片來源</a><a href="#top">回到頂部</a></div></footer>
  <noscript><p class="wrap error">請啟用 JavaScript 查看每日行程。行程資料亦可在本網站的 data/trip.json 查看。</p></noscript>
</body>
</html>
